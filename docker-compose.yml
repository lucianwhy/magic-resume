services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: magic_resume
      POSTGRES_USER: magic_resume
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-magic_resume_local_only}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U magic_resume -d magic_resume"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./services/api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://magic_resume:${POSTGRES_PASSWORD:-magic_resume_local_only}@postgres:5432/magic_resume
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:5173,http://127.0.0.1:3000
      DEMO_USER_ID: 00000000-0000-0000-0000-000000000001
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"

  init-data:
    image: magic-resume-web
    build:
      context: .
      dockerfile: Dockerfile
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /data/resumes && chown -R 1001:1001 /data"]
    volumes:
      - ./data:/data
    restart: "no"

  web:
    image: magic-resume-web
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - RESUME_API_KEY=${RESUME_API_KEY:?Set RESUME_API_KEY in .env}
      - RESUME_DATA_DIR=/data/resumes
      - RESUME_DEFAULT_ID=${RESUME_DEFAULT_ID:-}
      - RESUME_BOOTSTRAP_TOKEN=${RESUME_BOOTSTRAP_TOKEN:-}
    depends_on:
      init-data:
        condition: service_completed_successfully
    volumes:
      - ./data:/data
      - ./runtime-dist:/app/apps/web/dist:ro
      - ./packages/cli:/app/packages/cli:ro
    restart: always

  digital-human-redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  digital-human-api:
    build:
      context: ./services/digital-human
      dockerfile: docker/Dockerfile.api
    environment:
      OPENTALKING_REDIS_URL: redis://digital-human-redis:6379/0
      OPENTALKING_WORKER_URL: http://digital-human-worker:9001
      OPENTALKING_API_HOST: 0.0.0.0
      OPENTALKING_API_PORT: 8000
      OPENTALKING_INFERENCE_MOCK: ${OPENTALKING_INFERENCE_MOCK:-1}
    depends_on:
      digital-human-redis:
        condition: service_healthy
    ports:
      - "${DIGITAL_HUMAN_API_PORT:-8210}:8000"
    profiles: [digital-human]

  digital-human-worker:
    build:
      context: ./services/digital-human
      dockerfile: docker/Dockerfile.worker
    environment:
      OPENTALKING_REDIS_URL: redis://digital-human-redis:6379/0
      OPENTALKING_INFERENCE_MOCK: ${OPENTALKING_INFERENCE_MOCK:-1}
    depends_on:
      digital-human-redis:
        condition: service_healthy
    profiles: [digital-human]

volumes:
  postgres-data:
